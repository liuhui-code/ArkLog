name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ArkLog-windows-x86_64
            asset: ArkLog-windows-x86_64.exe
          - os: macos-15-intel
            artifact: ArkLog-macos-x86_64
            asset: ArkLog-macos-x86_64
          - os: macos-15
            artifact: ArkLog-macos-aarch64
            asset: ArkLog-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - name: Test workspace through package interface
        run: pnpm test

      - name: Build release executable through package interface
        run: pnpm build

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Check ArkLog package
        run: cargo check -p arklog

      - name: Verify 50 MiB memory budget
        run: pnpm memory:check

      - name: Prepare Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/arklog.exe dist/ArkLog-windows-x86_64.exe

      - name: Prepare macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/arklog dist/${{ matrix.asset }}

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop executables
        uses: actions/download-artifact@v8
        with:
          pattern: ArkLog-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --verify-tag
          --generate-notes
          --title "ArkLog $GITHUB_REF_NAME"
