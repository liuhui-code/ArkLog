[package]
name = "arklog"
version = "0.1.0"
description = "A focused HarmonyOS device log workbench"
authors = ["ArkLine contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "arklog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arklog-core = { path = "../crates/arklog-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
