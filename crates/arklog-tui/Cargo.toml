[package]
name = "arklog"
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
build = "build.rs"

[dependencies]
arboard = { version = "3.6.1", default-features = false }
arklog-core = { path = "../arklog-core" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

[build-dependencies]
winresource = "0.1"
